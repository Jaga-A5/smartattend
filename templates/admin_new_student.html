{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">NEW STUDENT</span><h1>Create a student login.</h1><p>Creates empty Semester 1–8 slots. Add subjects next.</p></div><form class="glass form-grid" method="post"><label>Student ID<input name="student_id" required></label><label>Password<input name="password" type="password" required></label><label>Full name<input name="name" required></label><label>Department<input name="department" placeholder="Information Technology"></label><label>Program<input name="program" placeholder="B.Tech IT"></label><label>Year<input name="year" placeholder="3rd Year"></label><label>College<input name="college"></label><label>Current semester<select name="current_semester">{% for n in range(1,9) %}<option value="{{n}}">Semester {{n}}</option>{% endfor %}</select></label><button>Create login →</button></form>{% endblock %}
