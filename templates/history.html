{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">ATTENDANCE HISTORY</span><h1>Recorded attendance.</h1><p>This is a read-only history imported into the system.</p></div><div class="glass table-wrap"><table><thead><tr><th>Date</th><th>Semester</th><th>Subject</th><th>Status</th></tr></thead><tbody>{% for r in records %}<tr><td>{{r['record_date']}}</td><td>{{r['label']}}</td><td>{{r['subject_name']}}</td><td><b class="badge {{'safe' if r['status']=='present' else 'critical'}}">{{r['status']}}</b></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
