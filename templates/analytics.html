{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">ANALYTICS</span><h1>Attendance, made visible.</h1><p>Current-semester subject comparison.</p></div><section class="chart-card glass"><canvas id="attendance-chart" data-labels='{{subjects|map(attribute="name")|list|tojson}}' data-values='{{subjects|map(attribute="percentage")|list|tojson}}'></canvas></section><div class="subject-grid">{% for x in subjects %}<article class="glass subject-card"><span>{{x['code']}}</span><h3>{{x['name']}}</h3><strong>{{x['percentage']}}%</strong><p>{{x['attended']}} present / {{x['absent']}} absent</p></article>{% endfor %}</div>{% endblock %}
