{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">ATTENDANCE PLANNER</span><h1>Know your next best move.</h1><p>Try any numbers — this never changes your stored attendance.</p></div><section class="calc-layout"><form class="glass calc-form" id="calculator"><label>Classes attended<input type="number" name="attended" value="{{overall['attended']}}" min="0"></label><label>Total classes<input type="number" name="total" value="{{overall['total']}}" min="0"></label><label>Required percentage<input type="number" name="target" value="{{student['target_attendance']}}" min="1" max="99.9" step=".1"></label><button>Calculate</button></form><article class="glass result" id="calc-result"><span>CURRENT ATTENDANCE</span><h2>{{overall['percentage']}}%</h2><p>Enter values and select Calculate for a personalized recommendation.</p></article></section>{% endblock %}
